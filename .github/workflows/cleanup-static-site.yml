name: One-time static site cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview removals or permanently delete them
        required: true
        type: choice
        options:
          - preview
          - delete
        default: preview

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean obsolete releases, branches, and tags
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_MODE: ${{ (github.event_name == 'push' || inputs.mode == 'delete') && 'delete' || 'dry-run' }}
        run: |
          if [[ "$CLEANUP_MODE" == "delete" ]]; then
            bash .github/scripts/cleanup-apk-releases.sh --delete
          else
            bash .github/scripts/cleanup-apk-releases.sh --dry-run
          fi
