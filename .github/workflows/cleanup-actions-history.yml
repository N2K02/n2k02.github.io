name: One-time Actions history cleanup

on:
  push:
    branches:
      - main
    paths:
      - .cleanup-actions-history-now

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old completed run records
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/cleanup-actions-history.sh
