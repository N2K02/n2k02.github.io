<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c18">
<meta name="description" content="Open a shared radio station in MRadio for Android.">
<meta property="og:type" content="website">
<meta property="og:title" content="Listen on MRadio">
<meta property="og:description" content="A radio station was shared with you. Tap to play in MRadio for Android.">
<meta property="og:url" content="https://n2k02.github.io/mradio/r/">
<title>Listen on MRadio</title>
<style>
:root{color-scheme:dark;--bg:#090c18;--card:#171c30;--text:#f7f8ff;--muted:#b5bed2}
*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:25px;background:radial-gradient(circle at top,#442950 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:510px;width:100%;padding:clamp(26px,5vw,42px);border:1px solid #404765;border-radius:24px;background:var(--card);box-shadow:0 20px 70px #0005}
.brand{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;color:#ff9fc9}h1{font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-.055em;margin:21px 0}p{color:var(--muted);margin-bottom:26px}a{color:#e2cbff}
.actions{display:grid;gap:14px}.action{display:block;text-align:center;padding:14px 18px;border-radius:12px;background:linear-gradient(110deg,#ff85b8,#b59cff);color:#1a0d29;text-decoration:none;font-weight:800}
.secondary{display:block;text-align:center}.note{font-size:.85rem;margin:24px 0 0}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<div class="brand">MRadio ◉</div>
<h1>Listen to this radio stream</h1>
<p id="status">Open the shared stream in MRadio on your Android device.</p>
<div class="actions">
<a id="launch" class="action hidden" href="#">Open in MRadio</a>
<a class="secondary" href="/mradio/download/">Get MRadio for Android</a>
</div>
<p class="note">If MRadio does not launch automatically when tapping a shared link, use the Open button above. You can also use Share → MRadio from your browser.</p>
</main>
<script>
(() => {
  'use strict';
  const launch = document.getElementById('launch');
  const status = document.getElementById('status');
  const supplied = new URLSearchParams(location.search).get('u');
  try {
    if (!supplied || supplied.length > 4096) throw new Error('Missing or invalid stream');
    const url = new URL(supplied);
    if (!['http:', 'https:'].includes(url.protocol) || !url.hostname || url.username || url.password) {
      throw new Error('Only HTTP(S) streams are supported');
    }
    launch.href = 'mradio://open?url=' + encodeURIComponent(supplied);
    launch.classList.remove('hidden');
  } catch (_) {
    status.textContent = 'This link does not contain a valid radio stream. Ask the sender to share again from MRadio.';
  }
})();
</script>
</body>
</html>
